name: chart

# Lints and packages the Helm chart, installs it into a kind cluster (fake LLM and embeddings: fast, no GPU, no model download) and, on a
# tag chart-vX.Y.Z whose version equals infra/helm/baracel-portal/Chart.yaml, pushes it to ghcr.io/<owner>/charts (OCI).
on:
  pull_request:
    paths: [infra/helm/**, infra/k8s/**, scripts/**, backend/Dockerfile, frontend/Dockerfile, ai-service/Dockerfile.slim, .github/workflows/chart.yml]
  push:
    branches: [main]
    paths: [infra/helm/**]
    tags: ["chart-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chart-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.2
      - id: v
        run: |
          echo "version=$(awk '/^version:/ {print $2}' infra/helm/baracel-portal/Chart.yaml)" >> "$GITHUB_OUTPUT"
      - run: helm lint infra/helm/baracel-portal --set ollama.hostAddress=10.0.0.1
      - run: helm package infra/helm/baracel-portal --destination dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chart
          path: dist/*.tgz
          if-no-files-found: error

  kind-install:
    # The same scripts a developer runs on a laptop: cluster, ingress, images, Secrets, Helm install, helm test, Gitea set-up, smoke test.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KIND_DEPLOY: helm
      KIND_LLM_PROVIDER: fake
      KIND_EMBEDDING_PROVIDER: fake
      KIND_WAIT_MINUTES: "25"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.2
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          install_only: true
          version: v0.30.0
      - name: Create the cluster, install the chart, run helm test
        run: scripts/kind-up.sh
      - name: Smoke test
        run: scripts/kind-smoke.sh
      - name: Diagnostics
        if: failure()
        run: |
          kubectl --context kind-baracel -n baracel-portal get pods -o wide || true
          kubectl --context kind-baracel -n baracel-portal describe pods | tail -150 || true
          for d in portal-backend keycloak ai-service gitea; do echo "== $d"; kubectl --context kind-baracel -n baracel-portal logs deploy/$d --tail=60 || true; done

  publish:
    if: startsWith(github.ref, 'refs/tags/chart-v')
    needs: [package, kind-install]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.2
      - name: The tag must name the chart version
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          tag="${GITHUB_REF_NAME#chart-v}"
          test "$tag" = "$VERSION" || { echo "tag $tag does not match Chart.yaml $VERSION"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chart
          path: dist
      - name: Push to ghcr.io (OCI)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          helm push "dist/baracel-portal-$VERSION.tgz" "oci://ghcr.io/$owner/charts"
          echo "Pushed oci://ghcr.io/$owner/charts/baracel-portal:$VERSION" >> "$GITHUB_STEP_SUMMARY"
