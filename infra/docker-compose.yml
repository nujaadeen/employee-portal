name: baracel

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432"   # 5433 on the host so it does not clash with a local PostgreSQL on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change-me-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      KC_HTTP_PORT: "8180"
      KC_HOSTNAME: http://localhost:8180
      KC_HEALTH_ENABLED: "true"
      KC_LOG_LEVEL: ${KC_LOG_LEVEL:-info}
      # Placeholders used inside keycloak/realm/baracel-realm.json
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-change-me}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-change-me}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-change-me}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-change-me}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-change-me}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-change-me}
      PORTAL_SERVICE_CLIENT_SECRET: ${PORTAL_SERVICE_CLIENT_SECRET:-change-me-service-secret}
      PORTAL_BACKEND_AI_CLIENT_SECRET: ${PORTAL_BACKEND_AI_CLIENT_SECRET:-change-me-backend-ai-secret}
      GITEA_OIDC_CLIENT_SECRET: ${GITEA_OIDC_CLIENT_SECRET:-change-me-gitea-oidc-secret}
      # Gitea (in Docker) reaches Keycloak as host.docker.internal; token and userinfo URLs follow the request host,
      # while the issuer and the browser login URL stay http://localhost:8180.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8180:8180"
    volumes:
      - ../keycloak/realm:/opt/keycloak/data/import:ro
      - ../keycloak/themes:/opt/keycloak/themes:ro
    healthcheck:
      # The Keycloak image has no curl; use a bash TCP request against the management port.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  gitea:
    image: gitea/gitea:1.24
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: postgres:5432
      GITEA__database__NAME: gitea
      GITEA__database__USER: postgres
      GITEA__database__PASSWD: ${POSTGRES_PASSWORD:-postgres}
      GITEA__server__ROOT_URL: http://localhost:3000/
      GITEA__server__HTTP_PORT: "3000"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__webhook__ALLOWED_HOST_LIST: "*"   # lets Gitea call Spring on the host (dev only)
      GITEA__oauth2_client__ENABLE_AUTO_REGISTRATION: "true"   # first Keycloak sign-in creates the Gitea user
      GITEA__oauth2_client__USERNAME: preferred_username        # same username as in the portal (gitea_username)
      GITEA__oauth2_client__ACCOUNT_LINKING: auto
      GITEA__mailer__ENABLED: "true"
      GITEA__mailer__PROTOCOL: smtp
      GITEA__mailer__SMTP_ADDR: mailpit
      GITEA__mailer__SMTP_PORT: "1025"
      GITEA__mailer__FROM: gitea@baracel.example
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets Gitea call Spring running on the host
    volumes:
      - giteadata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s


  # ---- AI service (Phase 2) -------------------------------------------------------------------------------------

  # Creates the ai_service database. init.sql only runs on a brand new Postgres volume, so this also covers old volumes.
  ai-db-init:
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - psql -h postgres -U postgres -tc "SELECT 1 FROM pg_database WHERE datname='ai_service'" | grep -q 1 || psql -h postgres -U postgres -c "CREATE DATABASE ai_service"
    restart: "no"

  chroma:
    image: chromadb/chroma:1.5.9
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chromadata:/data
    # Not published on the host: only ai-service reaches it, over the compose network.
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8000 && printf \"GET /api/v2/heartbeat HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q nanosecond <&3'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollamadata:/root/.ollama
    # GPU reservation. Needs the NVIDIA Container Toolkit. Without a GPU, add -f docker-compose.cpu.yml (see docs/ai-service.md).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 10s

  # One-shot: pulls the chat model into the ollama volume (no-op when it is already there).
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull ${OLLAMA_MODEL:-qwen2.5:7b-instruct}"]
    restart: "no"

  ai-service:
    build:
      context: ../ai-service
    depends_on:
      ai-db-init:
        condition: service_completed_successfully
      chroma:
        condition: service_healthy
      ollama:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/ai_service
      OIDC_ISSUER: http://localhost:8180/realms/baracel          # the issuer inside tokens
      OIDC_JWKS_URL: http://keycloak:8180/realms/baracel/protocol/openid-connect/certs   # reachable from this container
      OIDC_AUDIENCE: ai-service
      CHROMA_URL: http://chroma:8000
      AI_LLM_PROVIDER: ${AI_LLM_PROVIDER:-ollama}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      AI_MAX_UPLOAD_MB: ${AI_MAX_UPLOAD_MB:-25}
      GOOGLE_SA_KEY_PATH: ${GOOGLE_SA_KEY_PATH:-}
      UPLOAD_DIR: /data/uploads
    ports:
      - "127.0.0.1:8000:8000"   # localhost only
    volumes:
      - aiuploads:/data/uploads
      - hfcache:/root/.cache/huggingface   # embedding model files, downloaded once
      - ${GOOGLE_SA_KEY_HOST_PATH:-/dev/null}:/run/secrets/google-sa.json:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz').status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s

volumes:
  pgdata:
  giteadata:
  chromadata:
  ollamadata:
  aiuploads:
  hfcache:
