server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }
  # runtime configuration written at container start; never cached
  location = /config.json { add_header Cache-Control "no-store"; }
  # hashed build files can be cached for a long time
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  # single page app: every other path is the app
  location / { add_header Cache-Control "no-cache"; try_files $uri /index.html; }
}
