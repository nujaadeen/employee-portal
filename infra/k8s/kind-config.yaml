# kind cluster for the Baracel portal: one node that runs the ingress controller and publishes ports 80 and 443 of this machine.
# Node image pinned to the digest from the kind v0.30.0 release notes (Kubernetes 1.34.0).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: baracel
networking:
  apiServerAddress: "127.0.0.1"
nodes:
  - role: control-plane
    image: kindest/node:v1.34.0@sha256:7416a61b42b1662ca6ca89f02028ac133a309a2a30ba309614e8ec94d976dc5a
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        listenAddress: "127.0.0.1"
        protocol: TCP
