# The AI service is only reachable inside the cluster (Service ai-service). It has no Ingress: only the backend calls it.
apiVersion: v1
kind: ServiceAccount
metadata: { name: ai-service, labels: { app.kubernetes.io/name: ai-service, app.kubernetes.io/part-of: baracel-portal } }
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: ai-models, labels: { app.kubernetes.io/name: ai-service, app.kubernetes.io/part-of: baracel-portal } }   # the embedding model cache (about 2.3 GB)
spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 6Gi } } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: ai-uploads, labels: { app.kubernetes.io/name: ai-service, app.kubernetes.io/part-of: baracel-portal } }   # uploaded PDFs (needed to re-index)
spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 1Gi } } }
---
apiVersion: v1
kind: Service
metadata: { name: ai-service, labels: { app.kubernetes.io/name: ai-service, app.kubernetes.io/part-of: baracel-portal } }
spec:
  selector: { app.kubernetes.io/name: ai-service }
  ports: [{ name: http, port: 8000, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: ai-service, labels: { app.kubernetes.io/name: ai-service, app.kubernetes.io/part-of: baracel-portal } }
spec:
  replicas: 1
  strategy: { type: Recreate }       # two ReadWriteOnce volumes
  selector: { matchLabels: { app.kubernetes.io/name: ai-service } }
  template:
    metadata: { labels: { app.kubernetes.io/name: ai-service, app.kubernetes.io/part-of: baracel-portal } }
    spec:
      serviceAccountName: ai-service
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001 }
      initContainers:
        - name: wait-for-db
          image: postgres:16.14
          command: ["sh", "-c", "until pg_isready -h portal-postgres -U postgres; do echo waiting for the database; sleep 2; done"]
          securityContext: { runAsUser: 999 }
          resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { memory: 64Mi } }
      containers:
        - name: ai-service
          image: baracel/ai-service:local
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8000 }]
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          env:
            - name: OIDC_ISSUER
              valueFrom: { configMapKeyRef: { name: portal-config, key: ISSUER_URL } }
            - { name: OIDC_AUDIENCE, value: ai-service }
            - name: CHROMA_URL
              valueFrom: { configMapKeyRef: { name: portal-config, key: CHROMA_URL } }
            - name: AI_LLM_PROVIDER
              valueFrom: { configMapKeyRef: { name: portal-config, key: AI_LLM_PROVIDER } }
            - name: OLLAMA_URL
              valueFrom: { configMapKeyRef: { name: portal-config, key: OLLAMA_URL } }
            - name: OLLAMA_MODEL
              valueFrom: { configMapKeyRef: { name: portal-config, key: OLLAMA_MODEL } }
            - name: EMBEDDING_PROVIDER
              valueFrom: { configMapKeyRef: { name: portal-config, key: EMBEDDING_PROVIDER } }
            - name: EMBEDDING_MODEL
              valueFrom: { configMapKeyRef: { name: portal-config, key: EMBEDDING_MODEL } }
            - name: EMBEDDING_DEVICE
              valueFrom: { configMapKeyRef: { name: portal-config, key: EMBEDDING_DEVICE } }
            - name: AI_MAX_UPLOAD_MB
              valueFrom: { configMapKeyRef: { name: portal-config, key: AI_MAX_UPLOAD_MB } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: POSTGRES_PASSWORD } }
            - name: DATABASE_URL
              value: "postgresql+psycopg://postgres:$(POSTGRES_PASSWORD)@portal-postgres:5432/ai_service"
            - { name: HF_HOME, value: /models }
            - { name: UPLOAD_DIR, value: /data/uploads }
          # The first start downloads the embedding model into the volume: the probe gives it up to 30 minutes.
          startupProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10, failureThreshold: 180 }
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 3 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 20, timeoutSeconds: 5, failureThreshold: 6 }
          resources: { requests: { cpu: 250m, memory: 1Gi }, limits: { cpu: "3", memory: 3584Mi } }
          volumeMounts:
            - { name: models, mountPath: /models }
            - { name: uploads, mountPath: /data/uploads }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: models, persistentVolumeClaim: { claimName: ai-models } }
        - { name: uploads, persistentVolumeClaim: { claimName: ai-uploads } }
        - { name: tmp, emptyDir: {} }
