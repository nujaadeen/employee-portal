apiVersion: v1
kind: ServiceAccount
metadata: { name: portal-backend, labels: { app.kubernetes.io/name: portal-backend, app.kubernetes.io/part-of: baracel-portal } }
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata: { name: portal-backend, labels: { app.kubernetes.io/name: portal-backend, app.kubernetes.io/part-of: baracel-portal } }
spec:
  selector: { app.kubernetes.io/name: portal-backend }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: portal-backend, labels: { app.kubernetes.io/name: portal-backend, app.kubernetes.io/part-of: baracel-portal } }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: portal-backend } }
  template:
    metadata: { labels: { app.kubernetes.io/name: portal-backend, app.kubernetes.io/part-of: baracel-portal } }
    spec:
      serviceAccountName: portal-backend
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001 }
      initContainers:
        - name: wait-for-db
          image: postgres:16.14
          command: ["sh", "-c", "until pg_isready -h portal-postgres -U postgres; do echo waiting for the database; sleep 2; done"]
          resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { memory: 64Mi } }
      containers:
        - name: backend
          image: baracel/portal-backend:local
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          env:
            # "local" profile = the demo seed (people, Sprint 23, leave) that matches the Keycloak users. Local overlay only.
            - { name: SPRING_PROFILES_ACTIVE, value: local }
            - { name: PORTAL_DB_URL, value: "jdbc:postgresql://portal-postgres:5432/portal" }
            - { name: PORTAL_DB_USER, value: postgres }
            - { name: MAIL_PORT, value: "1025" }
            - name: PORTAL_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: POSTGRES_PASSWORD } }
            - name: KEYCLOAK_ISSUER_URI
              valueFrom: { configMapKeyRef: { name: portal-config, key: ISSUER_URL } }
            - name: AI_TOKEN_URI
              value: "$(KEYCLOAK_ISSUER_URI)/protocol/openid-connect/token"
            - name: KEYCLOAK_BASE_URL
              valueFrom: { configMapKeyRef: { name: portal-config, key: AUTH_BASE_URL } }
            - name: PORTAL_WEB_URL
              valueFrom: { configMapKeyRef: { name: portal-config, key: PORTAL_URL } }
            - name: PORTAL_CORS_ORIGINS
              valueFrom: { configMapKeyRef: { name: portal-config, key: CORS_ORIGIN } }
            - name: MAIL_HOST
              valueFrom: { configMapKeyRef: { name: portal-config, key: MAIL_HOST } }
            - name: GITEA_BASE_URL
              valueFrom: { configMapKeyRef: { name: portal-config, key: GITEA_BASE_URL } }
            - name: GITEA_PUBLIC_URL
              valueFrom: { configMapKeyRef: { name: portal-config, key: GIT_PUBLIC_URL } }
            - name: AI_MODE
              valueFrom: { configMapKeyRef: { name: portal-config, key: AI_MODE } }
            - name: AI_SERVICE_URL
              valueFrom: { configMapKeyRef: { name: portal-config, key: AI_SERVICE_URL } }
            - name: AI_MAX_UPLOAD_MB
              valueFrom: { configMapKeyRef: { name: portal-config, key: AI_MAX_UPLOAD_MB } }
            - name: SOCIAL_LINKEDIN_ENABLED
              valueFrom: { configMapKeyRef: { name: portal-config, key: SOCIAL_LINKEDIN_ENABLED } }
            - name: SOCIAL_LINKEDIN_COMPANY_ENABLED
              valueFrom: { configMapKeyRef: { name: portal-config, key: SOCIAL_LINKEDIN_COMPANY_ENABLED } }
            - name: PORTAL_SERVICE_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: backend-secrets, key: PORTAL_SERVICE_CLIENT_SECRET } }
            - name: PORTAL_BACKEND_AI_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: backend-secrets, key: PORTAL_BACKEND_AI_CLIENT_SECRET } }
            - name: GITEA_TOKEN
              valueFrom: { secretKeyRef: { name: backend-secrets, key: GITEA_TOKEN } }
            - name: GITEA_WEBHOOK_SECRET
              valueFrom: { secretKeyRef: { name: backend-secrets, key: GITEA_WEBHOOK_SECRET } }
            - name: SOCIAL_TOKEN_KEY
              valueFrom: { secretKeyRef: { name: backend-secrets, key: SOCIAL_TOKEN_KEY } }
          startupProbe: { httpGet: { path: /actuator/health/liveness, port: http }, periodSeconds: 5, failureThreshold: 60 }
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: http }, periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 6 }
          livenessProbe: { httpGet: { path: /actuator/health/liveness, port: http }, periodSeconds: 20, timeoutSeconds: 5, failureThreshold: 6 }
          resources: { requests: { cpu: 200m, memory: 512Mi }, limits: { cpu: "2", memory: 1Gi } }
