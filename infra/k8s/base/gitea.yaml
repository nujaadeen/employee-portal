# Gitea (rootless image). Sign-in goes through Keycloak; the portal backend gets webhooks at its cluster service name.
apiVersion: v1
kind: ServiceAccount
metadata: { name: gitea, labels: { app.kubernetes.io/name: gitea, app.kubernetes.io/part-of: baracel-portal } }
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: gitea-data, labels: { app.kubernetes.io/name: gitea, app.kubernetes.io/part-of: baracel-portal } }
spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 2Gi } } }
---
apiVersion: v1
kind: Service
metadata: { name: gitea, labels: { app.kubernetes.io/name: gitea, app.kubernetes.io/part-of: baracel-portal } }
spec:
  selector: { app.kubernetes.io/name: gitea }
  ports: [{ name: http, port: 3000, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: gitea, labels: { app.kubernetes.io/name: gitea, app.kubernetes.io/part-of: baracel-portal } }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app.kubernetes.io/name: gitea } }
  template:
    metadata: { labels: { app.kubernetes.io/name: gitea, app.kubernetes.io/part-of: baracel-portal } }
    spec:
      serviceAccountName: gitea
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000 }
      initContainers:
        - name: wait-for-db
          image: postgres:16.14
          command: ["sh", "-c", "until pg_isready -h portal-postgres -U postgres; do echo waiting for the database; sleep 2; done"]
          securityContext: { runAsUser: 999 }
          resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { memory: 64Mi } }
      containers:
        - name: gitea
          image: gitea/gitea:1.24.6-rootless
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 3000 }]
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          env:
            - { name: GITEA__database__DB_TYPE, value: postgres }
            - { name: GITEA__database__HOST, value: "portal-postgres:5432" }
            - { name: GITEA__database__NAME, value: gitea }
            - { name: GITEA__database__USER, value: postgres }
            - name: GITEA__database__PASSWD
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: POSTGRES_PASSWORD } }
            - name: GIT_PUBLIC_URL                               # defined first: $(GIT_PUBLIC_URL) below needs it
              valueFrom: { configMapKeyRef: { name: portal-config, key: GIT_PUBLIC_URL } }
            - name: GITEA__server__ROOT_URL                      # what browsers open, with the trailing slash
              value: "$(GIT_PUBLIC_URL)/"
            - { name: GITEA__server__HTTP_PORT, value: "3000" }
            - { name: GITEA__server__DISABLE_SSH, value: "true" }
            - { name: GITEA__security__INSTALL_LOCK, value: "true" }
            # Webhooks may be sent to the backend by its cluster service name (and nothing private besides it).
            - { name: GITEA__webhook__ALLOWED_HOST_LIST, value: "portal-backend.baracel-portal.svc.cluster.local,portal-backend" }
            - { name: GITEA__oauth2_client__ENABLE_AUTO_REGISTRATION, value: "true" }
            - { name: GITEA__oauth2_client__USERNAME, value: preferred_username }
            - { name: GITEA__oauth2_client__ACCOUNT_LINKING, value: auto }
            - { name: GITEA__mailer__ENABLED, value: "true" }
            - { name: GITEA__mailer__PROTOCOL, value: smtp }
            - { name: GITEA__mailer__SMTP_ADDR, value: mailpit }
            - { name: GITEA__mailer__SMTP_PORT, value: "1025" }
            - { name: GITEA__mailer__FROM, value: "gitea@baracel.example" }
          readinessProbe: { httpGet: { path: /api/healthz, port: http }, periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 12 }
          livenessProbe: { httpGet: { path: /api/healthz, port: http }, initialDelaySeconds: 30, periodSeconds: 20, timeoutSeconds: 5, failureThreshold: 6 }
          resources: { requests: { cpu: 100m, memory: 192Mi }, limits: { cpu: "1", memory: 640Mi } }
          volumeMounts:
            - { name: data, mountPath: /var/lib/gitea }
            - { name: config, mountPath: /etc/gitea }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: gitea-data } }
        - { name: config, emptyDir: {} }
