# Catches the mail of Keycloak, the backend and Gitea. Not exposed through the ingress; reach it with: kubectl -n baracel-portal port-forward svc/mailpit 8025
apiVersion: v1
kind: ServiceAccount
metadata: { name: mailpit, labels: { app.kubernetes.io/name: mailpit, app.kubernetes.io/part-of: baracel-portal } }
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata: { name: mailpit, labels: { app.kubernetes.io/name: mailpit, app.kubernetes.io/part-of: baracel-portal } }
spec:
  selector: { app.kubernetes.io/name: mailpit }
  ports:
    - { name: smtp, port: 1025, targetPort: smtp }
    - { name: http, port: 8025, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: mailpit, labels: { app.kubernetes.io/name: mailpit, app.kubernetes.io/part-of: baracel-portal } }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: mailpit } }
  template:
    metadata: { labels: { app.kubernetes.io/name: mailpit, app.kubernetes.io/part-of: baracel-portal } }
    spec:
      serviceAccountName: mailpit
      automountServiceAccountToken: false
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.32
          imagePullPolicy: IfNotPresent
          ports: [{ name: smtp, containerPort: 1025 }, { name: http, containerPort: 8025 }]
          readinessProbe: { httpGet: { path: /livez, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /livez, port: http }, periodSeconds: 20 }
          resources: { requests: { cpu: 10m, memory: 24Mi }, limits: { cpu: 200m, memory: 128Mi } }
