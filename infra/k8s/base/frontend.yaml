apiVersion: v1
kind: ServiceAccount
metadata: { name: portal-frontend, labels: { app.kubernetes.io/name: portal-frontend, app.kubernetes.io/part-of: baracel-portal } }
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata: { name: portal-frontend, labels: { app.kubernetes.io/name: portal-frontend, app.kubernetes.io/part-of: baracel-portal } }
spec:
  selector: { app.kubernetes.io/name: portal-frontend }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: portal-frontend, labels: { app.kubernetes.io/name: portal-frontend, app.kubernetes.io/part-of: baracel-portal } }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: portal-frontend } }
  template:
    metadata: { labels: { app.kubernetes.io/name: portal-frontend, app.kubernetes.io/part-of: baracel-portal } }
    spec:
      serviceAccountName: portal-frontend
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 101, runAsGroup: 101 }
      containers:
        - name: frontend
          image: baracel/portal-frontend:local
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          env:
            # runtime configuration: the container start script writes these into the app and into /config.json
            - name: VITE_API_URL
              valueFrom: { configMapKeyRef: { name: portal-config, key: PORTAL_URL } }
            - name: VITE_OIDC_AUTHORITY
              valueFrom: { configMapKeyRef: { name: portal-config, key: ISSUER_URL } }
            - { name: VITE_OIDC_CLIENT_ID, value: portal-web }
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 5, timeoutSeconds: 3 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 15, timeoutSeconds: 3 }
          resources: { requests: { cpu: 10m, memory: 24Mi }, limits: { cpu: 200m, memory: 96Mi } }
