apiVersion: v1
kind: ServiceAccount
metadata: { name: chroma, labels: { app.kubernetes.io/name: chroma, app.kubernetes.io/part-of: baracel-portal } }
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: chroma-data, labels: { app.kubernetes.io/name: chroma, app.kubernetes.io/part-of: baracel-portal } }
spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 2Gi } } }
---
apiVersion: v1
kind: Service
metadata: { name: chroma, labels: { app.kubernetes.io/name: chroma, app.kubernetes.io/part-of: baracel-portal } }
spec:
  selector: { app.kubernetes.io/name: chroma }
  ports: [{ name: http, port: 8000, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: chroma, labels: { app.kubernetes.io/name: chroma, app.kubernetes.io/part-of: baracel-portal } }
spec:
  replicas: 1
  strategy: { type: Recreate }       # one volume, ReadWriteOnce
  selector: { matchLabels: { app.kubernetes.io/name: chroma } }
  template:
    metadata: { labels: { app.kubernetes.io/name: chroma, app.kubernetes.io/part-of: baracel-portal } }
    spec:
      serviceAccountName: chroma
      automountServiceAccountToken: false
      containers:
        - name: chroma
          image: chromadb/chroma:1.5.9
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8000 }]
          env:
            - { name: IS_PERSISTENT, value: "TRUE" }
            - { name: ANONYMIZED_TELEMETRY, value: "FALSE" }
          readinessProbe: { httpGet: { path: /api/v2/heartbeat, port: http }, periodSeconds: 5, timeoutSeconds: 3, failureThreshold: 12 }
          livenessProbe: { httpGet: { path: /api/v2/heartbeat, port: http }, initialDelaySeconds: 15, periodSeconds: 20, timeoutSeconds: 5, failureThreshold: 6 }
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: "1", memory: 512Mi } }
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: chroma-data }
