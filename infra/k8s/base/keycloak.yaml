# Keycloak: the stock image plus the Baracel realm and login theme (infra/k8s/images/keycloak/Dockerfile).
# HTTP only. This is the local overlay: there is no TLS here, never reuse it as is outside a laptop.
apiVersion: v1
kind: ServiceAccount
metadata: { name: keycloak, labels: { app.kubernetes.io/name: keycloak, app.kubernetes.io/part-of: baracel-portal } }
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata: { name: keycloak, labels: { app.kubernetes.io/name: keycloak, app.kubernetes.io/part-of: baracel-portal } }
spec:
  selector: { app.kubernetes.io/name: keycloak }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: keycloak, labels: { app.kubernetes.io/name: keycloak, app.kubernetes.io/part-of: baracel-portal } }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: keycloak } }
  template:
    metadata: { labels: { app.kubernetes.io/name: keycloak, app.kubernetes.io/part-of: baracel-portal } }
    spec:
      serviceAccountName: keycloak
      automountServiceAccountToken: false
      initContainers:
        - name: wait-for-db
          image: postgres:16.14
          command: ["sh", "-c", "until pg_isready -h keycloak-postgres -U postgres; do echo waiting for the database; sleep 2; done"]
          resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { memory: 64Mi } }
      containers:
        - name: keycloak
          image: baracel/keycloak:local
          imagePullPolicy: IfNotPresent
          args: ["start-dev", "--import-realm", "--health-enabled=true"]
          ports:
            - { name: http, containerPort: 8080 }
            - { name: management, containerPort: 9000 }
          env:
            - { name: KC_HTTP_ENABLED, value: "true" }
            - { name: KC_HTTP_PORT, value: "8080" }
            - { name: KC_PROXY_HEADERS, value: xforwarded }     # behind ingress-nginx
            - { name: KC_HEALTH_ENABLED, value: "true" }
            - { name: KC_DB, value: postgres }
            - { name: KC_DB_URL, value: "jdbc:postgresql://keycloak-postgres:5432/keycloak" }
            - { name: KC_DB_USERNAME, value: postgres }
            - name: KC_HOSTNAME                                  # the issuer every client sees: http://auth.baracel.local
              valueFrom: { configMapKeyRef: { name: portal-config, key: AUTH_BASE_URL } }
            - name: KC_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: POSTGRES_PASSWORD } }
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom: { secretKeyRef: { name: keycloak-secrets, key: KEYCLOAK_ADMIN } }
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: keycloak-secrets, key: KEYCLOAK_ADMIN_PASSWORD } }
          # ${PLACEHOLDERS} of the realm file
          envFrom:
            - secretRef: { name: keycloak-realm-secrets }
          startupProbe: { httpGet: { path: /health/started, port: management }, periodSeconds: 5, failureThreshold: 60 }
          readinessProbe: { httpGet: { path: /health/ready, port: management }, periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 6 }
          livenessProbe: { httpGet: { path: /health/live, port: management }, periodSeconds: 20, timeoutSeconds: 5, failureThreshold: 6 }
          resources: { requests: { cpu: 200m, memory: 640Mi }, limits: { cpu: "2", memory: 1280Mi } }
