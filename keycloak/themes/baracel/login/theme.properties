# Baracel login theme for Keycloak 26.8 (infra/docker-compose.yml).
# parent=keycloak gives every page we do not override (OTP, update profile, ...) the base FreeMarker templates.
# They render with the class names below, so they pick up the Baracel look too.
parent=keycloak
import=common/keycloak

# Only our own styles: tokens.css is copied from design/tokens.css by scripts/sync-theme.sh.
styles=css/tokens.css css/baracel.css
stylesCommon=
meta=viewport==width=device-width,initial-scale=1

kcHtmlClass=bc-html
kcBodyClass=bc-body
kcLoginClass=bc-page
kcHeaderClass=bc-hidden
kcHeaderWrapperClass=bc-hidden
kcFormCardClass=bc-card-body
kcFormHeaderClass=bc-card-head

kcFormClass=bc-form
kcFormGroupClass=bc-field
kcLabelWrapperClass=bc-label-row
kcLabelClass=bc-label
kcInputWrapperClass=bc-input-wrap
kcInputClass=bc-input
kcInputGroup=bc-input-group
kcInputErrorMessageClass=bc-error
kcFormSettingClass=bc-setting
kcFormOptionsClass=bc-options
kcFormOptionsWrapperClass=bc-options-wrap
kcFormButtonsClass=bc-buttons
kcCheckboxInputClass=bc-check
kcButtonClass=bc-btn
kcButtonPrimaryClass=bc-btn--primary
kcButtonDefaultClass=bc-btn--secondary
kcButtonBlockClass=bc-btn--block
kcButtonLargeClass=bc-btn--large
kcFormPasswordVisibilityButtonClass=bc-eye
kcFormPasswordVisibilityIconShow=bc-eye-show
kcFormPasswordVisibilityIconHide=bc-eye-hide
kcSignUpClass=bc-info
kcInfoAreaWrapperClass=bc-info-wrap
kcFormSocialAccountSectionClass=bc-social
kcFormSocialAccountListClass=bc-social-list
kcFormSocialAccountListButtonClass=bc-btn bc-btn--secondary bc-btn--block bc-btn--large
kcFormSocialAccountNameClass=bc-social-name
