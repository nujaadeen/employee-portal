server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: ${AI_MAX_UPLOAD_MB:25}MB
      max-request-size: ${AI_MAX_UPLOAD_MB:25}MB
  application:
    name: baracel-portal
  datasource:
    url: ${PORTAL_DB_URL:jdbc:postgresql://localhost:5433/portal}
    username: ${PORTAL_DB_USER:postgres}
    password: ${PORTAL_DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/baracel}
          audiences: portal-api
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.connectiontimeout: 2000
      mail.smtp.timeout: 3000
      mail.smtp.writetimeout: 3000

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs

portal:
  cors:
    allowed-origins: ${PORTAL_CORS_ORIGINS:http://localhost:5173}
  mail:
    enabled: ${PORTAL_MAIL_ENABLED:true}
    from: no-reply@baracel.example
  keycloak:
    base-url: ${KEYCLOAK_BASE_URL:http://localhost:8180}
    realm: baracel
    client-id: portal-service
    client-secret: ${PORTAL_SERVICE_CLIENT_SECRET:}
    admin-enabled: true
    web-client-id: portal-web
    web-redirect-uri: ${PORTAL_WEB_URL:http://localhost:5173}/
  access:
    default-role: EMPLOYEE
    approver: HR
    session-hours: 8
  leave:
    weekend-days: SATURDAY,SUNDAY
    status-job-cron: "0 5 0 * * *"
  ai:
    mode: ${AI_MODE:stub}          # stub (Phase 1, no AI service) or http (the FastAPI service)
    service:
      url: ${AI_SERVICE_URL:http://localhost:8000}
      token-uri: ${AI_TOKEN_URI:http://localhost:8180/realms/baracel/protocol/openid-connect/token}
      client-id: portal-backend-ai
      client-secret: ${PORTAL_BACKEND_AI_CLIENT_SECRET:}
      connect-timeout: 3s
      chat-timeout: 90s
      stream-idle-timeout: 120s     # the first token can take a while when the model is cold (local GPU)
      admin-timeout: 15s
      max-upload-mb: ${AI_MAX_UPLOAD_MB:25}
    breaker:
      failure-threshold: 5
      open-for: 30s
    rate-limit:
      chat-per-minute: 20

gitea:
  base-url: ${GITEA_BASE_URL:http://localhost:3000}
  public-url: ${GITEA_PUBLIC_URL:http://localhost:3000}   # what browsers open; may differ from base-url inside Docker
  token: ${GITEA_TOKEN:}
  webhook-secret: ${GITEA_WEBHOOK_SECRET:}
  move-to-review-on-pr-open: true
  move-to-done-on-pr-merge: true

social:
  frontend-url: ${PORTAL_WEB_URL:http://localhost:5173}
  crypto:
    token-key: ${SOCIAL_TOKEN_KEY:}          # base64, 32 bytes: openssl rand -base64 32
    token-key-id: ${SOCIAL_TOKEN_KEY_ID:k1}
    old-keys: ${SOCIAL_TOKEN_OLD_KEYS:}      # id:base64,id2:base64 so values written with an old key stay readable
  linkedin:
    enabled: ${SOCIAL_LINKEDIN_ENABLED:false}                 # false: publishing is SIMULATED (local development)
    company-enabled: ${SOCIAL_LINKEDIN_COMPANY_ENABLED:false} # company page posting needs LinkedIn approval (w_organization_social)
    client-id: ${LINKEDIN_CLIENT_ID:}
    client-secret: ${LINKEDIN_CLIENT_SECRET:}
    redirect-uri: ${LINKEDIN_REDIRECT_URI:http://localhost:8080/api/social/linkedin/callback}
    api-version: ${LINKEDIN_API_VERSION:202610}
    company-organization-id: ${LINKEDIN_COMPANY_ORGANIZATION_ID:}
